name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Tests use in-process PGlite, so no database or API keys are needed in CI.
      - run: pnpm turbo run lint typecheck test build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Mobile bundle (Android + iOS)
        run: pnpm --filter @paipai/mobile bundle:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paipai/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # Uses the runner's preinstalled Google Chrome and the PGlite sandbox API.
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e/.output
          retention-days: 7
